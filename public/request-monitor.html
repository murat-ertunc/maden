<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Request Monitor</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .controls input, .controls button, .controls select {
            padding: 8px 12px;
            border: 1px solid #555;
            background: #333;
            color: #fff;
            border-radius: 4px;
        }
        .controls button {
            cursor: pointer;
            background: #007acc;
        }
        .controls button:hover {
            background: #005fa3;
        }
        .controls button.danger {
            background: #d73027;
        }
        .controls button.danger:hover {
            background: #a52725;
        }
        .log-entry {
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            margin-bottom: 10px;
            padding: 15px;
            font-size: 13px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
        }
        .method {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 11px;
            color: white;
        }
        .method.GET { background: #28a745; }
        .method.POST { background: #007bff; }
        .method.PUT { background: #ffc107; color: #000; }
        .method.DELETE { background: #dc3545; }
        .method.PATCH { background: #6f42c1; }
        .timestamp {
            color: #888;
            font-size: 11px;
        }
        .url {
            color: #4fc3f7;
            word-break: break-all;
            margin: 5px 0;
        }
        .payload {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .payload pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .no-logs {
            text-align: center;
            color: #888;
            padding: 40px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 12px;
            border: 1px solid #555;
            background: #333;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        .pagination button:hover {
            background: #444;
        }
        .pagination button.active {
            background: #007acc;
        }
        .auto-refresh {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 HTTP Request Monitor</h1>
            <p>Tüm HTTP request'leri canlı olarak izleyin</p>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="URL veya method ara...">
            <button onclick="loadLogs()">🔄 Yenile</button>
            <button onclick="clearLogs()" class="danger">🗑️ Temizle</button>
            <select id="perPageSelect" onchange="loadLogs()">
                <option value="25">25 kayıt</option>
                <option value="50" selected>50 kayıt</option>
                <option value="100">100 kayıt</option>
            </select>
            <div class="auto-refresh">
                <label>
                    <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()"> 
                    Otomatik yenile (5s)
                </label>
            </div>
        </div>

        <div id="status"></div>
        <div id="logs"></div>
        <div id="pagination"></div>
    </div>

    <script>
        let currentPage = 1;
        let autoRefreshInterval = null;

        // Sayfa yüklendiğinde logları getir
        document.addEventListener('DOMContentLoaded', function() {
            loadLogs();
            
            // Arama inputu için debounce
            document.getElementById('searchInput').addEventListener('input', debounce(loadLogs, 500));
        });

        async function loadLogs() {
            try {
                const search = document.getElementById('searchInput').value;
                const perPage = document.getElementById('perPageSelect').value;
                
                const params = new URLSearchParams({
                    page: currentPage,
                    per_page: perPage,
                    search: search
                });

                const response = await fetch(`/api/request-logs?${params}`);
                const data = await response.json();

                if (data.success) {
                    displayLogs(data.logs);
                    displayPagination(data.pagination);
                    showStatus('Loglar başarıyla yüklendi', 'success');
                } else {
                    showStatus('Loglar yüklenirken hata: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('Bağlantı hatası: ' + error.message, 'error');
            }
        }

        function displayLogs(logs) {
            const logsContainer = document.getElementById('logs');
            
            if (logs.length === 0) {
                logsContainer.innerHTML = '<div class="no-logs">Henüz log kaydı bulunamadı</div>';
                return;
            }

            const logsHtml = logs.map(log => {
                const payloadHtml = Object.keys(log.payload).length > 0 ? 
                    `<div class="payload">
                        <strong>Payload:</strong>
                        <pre>${JSON.stringify(log.payload, null, 2)}</pre>
                    </div>` : '';

                const headersHtml = Object.keys(log.headers).length > 0 ? 
                    `<div class="payload">
                        <strong>Headers:</strong>
                        <pre>${JSON.stringify(log.headers, null, 2)}</pre>
                    </div>` : '';

                const queryHtml = Object.keys(log.query_params).length > 0 ? 
                    `<div class="payload">
                        <strong>Query Parameters:</strong>
                        <pre>${JSON.stringify(log.query_params, null, 2)}</pre>
                    </div>` : '';

                return `
                    <div class="log-entry">
                        <div class="log-header">
                            <div>
                                <span class="method ${log.method}">${log.method}</span>
                                <span style="color: #888; margin-left: 10px;">${log.ip}</span>
                            </div>
                            <div class="timestamp">${log.timestamp}</div>
                        </div>
                        <div class="url">${log.url}</div>
                        ${payloadHtml}
                        ${queryHtml}
                        ${headersHtml}
                    </div>
                `;
            }).join('');

            logsContainer.innerHTML = logsHtml;
        }

        function displayPagination(pagination) {
            const paginationContainer = document.getElementById('pagination');
            
            if (pagination.last_page <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let paginationHtml = '';
            
            // Önceki sayfa
            if (pagination.current_page > 1) {
                paginationHtml += `<button onclick="changePage(${pagination.current_page - 1})">‹ Önceki</button>`;
            }
            
            // Sayfa numaraları
            for (let i = Math.max(1, pagination.current_page - 2); i <= Math.min(pagination.last_page, pagination.current_page + 2); i++) {
                const activeClass = i === pagination.current_page ? 'active' : '';
                paginationHtml += `<button class="${activeClass}" onclick="changePage(${i})">${i}</button>`;
            }
            
            // Sonraki sayfa
            if (pagination.current_page < pagination.last_page) {
                paginationHtml += `<button onclick="changePage(${pagination.current_page + 1})">Sonraki ›</button>`;
            }

            paginationContainer.innerHTML = paginationHtml;
        }

        function changePage(page) {
            currentPage = page;
            loadLogs();
        }

        async function clearLogs() {
            if (!confirm('Tüm logları silmek istediğinizden emin misiniz?')) {
                return;
            }

            try {
                const response = await fetch('/api/request-logs', { method: 'DELETE' });
                const data = await response.json();
                
                if (data.success) {
                    showStatus('Loglar başarıyla temizlendi', 'success');
                    currentPage = 1;
                    loadLogs();
                } else {
                    showStatus('Loglar temizlenirken hata: ' + data.message, 'error');
                }
            } catch (error) {
                showStatus('Bağlantı hatası: ' + error.message, 'error');
            }
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(loadLogs, 5000);
                showStatus('Otomatik yenileme aktif', 'success');
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
                showStatus('Otomatik yenileme durduruldu', 'success');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
            
            // 3 saniye sonra mesajı gizle
            setTimeout(() => {
                statusDiv.innerHTML = '';
            }, 3000);
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
</html>
