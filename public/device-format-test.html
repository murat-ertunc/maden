<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Format Test - Gateway Data</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .section {
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        h2 {
            color: #764ba2;
            margin-top: 0;
            font-size: 18px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .response {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .success {
            border-left: 4px solid #28a745;
            background: #d4edda;
        }
        
        .error {
            border-left: 4px solid #dc3545;
            background: #f8d7da;
        }
        
        pre {
            margin: 10px 0;
            padding: 10px;
            background: #2d2d2d;
            color: #f8f8f2;
            border-radius: 5px;
            overflow-x: auto;
        }
        
        .data-format {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #ffc107;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Device Format Test</h1>
        <p class="subtitle">Cihazın (192.168.0.201) gönderdiği format ile test</p>

        <div class="section">
            <h2>📡 Gerçek Cihaz Formatı</h2>
            <div class="data-format">
                <strong>Format:</strong> Direct JSON Array<br>
                <strong>Örnek:</strong>
                <pre>[{"beacon_id":"ff:ff:11:a2:ce:43","gateway_id":"GW03","rssi":-65,"timestamp":"01:59:58"}]</pre>
            </div>
            <button onclick="sendDeviceFormat()">Cihaz Formatında Gönder</button>
            <div id="deviceResponse" class="response" style="display:none;"></div>
        </div>

        <div class="section">
            <h2>📊 Çoklu Okuma (Batch)</h2>
            <button onclick="sendBatchFormat()">5 Okuma Gönder</button>
            <div id="batchResponse" class="response" style="display:none;"></div>
        </div>

        <div class="section">
            <h2>📈 Veritabanı Durumu</h2>
            <button onclick="checkDatabase()">Veritabanını Kontrol Et</button>
            <div id="dbResponse" class="response" style="display:none;"></div>
        </div>

        <div class="section">
            <h2>🔍 Son Okumaları Görüntüle</h2>
            <button onclick="viewLatest()">Son Okumaları Getir</button>
            <div id="latestResponse" class="response" style="display:none;"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api/gateway-data';
        const BEACONS_URL = '/api/beacons/latest';

        function showResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'response ' + (isError ? 'error' : 'success');
            element.textContent = JSON.stringify(data, null, 2);
        }

        function showLoading(elementId) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = 'response';
            element.innerHTML = '<div class="loading"></div> Gönderiliyor...';
        }

        async function sendDeviceFormat() {
            showLoading('deviceResponse');
            
            // Cihazın gönderdiği formatta veri
            const data = [{
                "beacon_id": "ff:ff:11:a2:ce:43",
                "gateway_id": "GW03",
                "rssi": -65,
                "timestamp": new Date().toLocaleTimeString('tr-TR')
            }];

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                showResponse('deviceResponse', result, !response.ok);
            } catch (error) {
                showResponse('deviceResponse', { error: error.message }, true);
            }
        }

        async function sendBatchFormat() {
            showLoading('batchResponse');
            
            // 5 farklı beacon ile test
            const beacons = [
                "ff:ff:11:a2:ce:43",
                "ff:ff:22:b3:df:54",
                "ff:ff:33:c4:ea:65",
                "A4:C1:38:00:00:99",
                "B5:D2:49:11:11:AA"
            ];

            const data = beacons.map((beacon, index) => ({
                "beacon_id": beacon,
                "gateway_id": "GW03",
                "rssi": -60 - Math.floor(Math.random() * 20),
                "timestamp": new Date().toLocaleTimeString('tr-TR')
            }));

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                showResponse('batchResponse', result, !response.ok);
            } catch (error) {
                showResponse('batchResponse', { error: error.message }, true);
            }
        }

        async function checkDatabase() {
            showLoading('dbResponse');
            
            try {
                // Veritabanı sayısını almak için bir endpoint gerekiyor
                // Şimdilik son okumaları sayacağız
                const response = await fetch(BEACONS_URL + '?minutes=1440'); // Son 24 saat
                const result = await response.json();
                
                const summary = {
                    total_readings: result.data?.length || 0,
                    active_beacons: result.meta?.active_beacons || 0,
                    active_gateways: result.meta?.active_gateways || 0,
                    data_source: result.meta?.source || 'unknown'
                };
                
                showResponse('dbResponse', summary, !response.ok);
            } catch (error) {
                showResponse('dbResponse', { error: error.message }, true);
            }
        }

        async function viewLatest() {
            showLoading('latestResponse');
            
            try {
                const response = await fetch(BEACONS_URL + '?minutes=60'); // Son 1 saat
                const result = await response.json();
                
                showResponse('latestResponse', result, !response.ok);
            } catch (error) {
                showResponse('latestResponse', { error: error.message }, true);
            }
        }

        // Sayfa yüklendiğinde otomatik veritabanı kontrolü
        window.addEventListener('load', () => {
            setTimeout(checkDatabase, 500);
        });
    </script>
</body>
</html>
